<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X-FUNDS · Paper Trading Brokerage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23059669'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='monospace' font-weight='700'>X</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F17;--s1:#131B2B;--s2:#1a2438;--line:rgba(255,255,255,.08);--tx:#e6ebf4;--mut:#8a97ad;--em:#10b981;--emd:#059669;--ind:#6366f1;--amb:#f59e0b;--rose:#f43f5e}
@media(prefers-color-scheme:light){:root{--bg:#f4f6fa;--s1:#fff;--s2:#eef1f6;--line:#dfe4ec;--tx:#0f172a;--mut:#5b6678;--em:#059669;--emd:#047857}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
.mono,td.n,.n{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--s1);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{font-weight:800;font-size:17px;display:flex;gap:8px;align-items:center}.logo b{background:var(--emd);color:#fff;border-radius:6px;padding:0 8px;font-family:'JetBrains Mono'}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}nav button{background:none;border:0;color:var(--mut);padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;border-radius:6px;white-space:nowrap}
nav button.on{color:var(--em);background:var(--s2)}main{max-width:1180px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0 0 14px}h2{font-size:15px;margin:0 0 10px}.mut{color:var(--mut)}.sm{font-size:12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:16px}.g2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}.kpi .v{font-size:20px;font-weight:700;margin-top:2px}
.up{color:var(--em)}.dn{color:var(--rose)}.am{color:var(--amb)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line)}td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}.tw{overflow-x:auto}td.n,th.r{text-align:right}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:7px;padding:9px 10px;font:inherit;width:100%}input:focus,select:focus,textarea:focus{outline:2px solid var(--emd)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
.btn{background:var(--emd);color:#fff;border:0;border-radius:7px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.btn.sec{background:var(--s2);color:var(--tx);border:1px solid var(--line)}.btn.dng{background:var(--rose)}.btn.sm{padding:4px 10px;font-size:12px}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden}.seg button{flex:1;background:var(--bg);color:var(--mut);border:0;padding:8px;font:inherit;font-weight:700;cursor:pointer}.seg button.on.b{background:var(--emd);color:#fff}.seg button.on.s{background:var(--rose);color:#fff}
.auth{max-width:420px;margin:48px auto}.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:var(--s2);border:1px solid var(--line);color:var(--mut);border-radius:7px;padding:6px 12px;font:inherit;font-weight:600;cursor:pointer}.tabs button.on{color:#fff;background:var(--emd)}
.banner{border:1px solid var(--amb);background:rgba(245,158,11,.1);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--s2)}.leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px}.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:20;padding:16px}#modal.on{display:flex}#modal .card{max-width:460px;width:100%;margin:0;max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px}#toast div{background:var(--s2);border:1px solid var(--line);border-left:4px solid var(--em);padding:10px 16px;border-radius:8px;max-width:90vw}#toast div.bad{border-left-color:var(--rose)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>.btn{flex:none}.sel{cursor:pointer}.sel:hover{background:var(--s2)}.sel.on{background:var(--s2);outline:1px solid var(--emd)}
svg.ch{width:100%;height:150px}
</style></head>
<body>
<div id="app"></div><div id="modal"></div><div id="toast"></div>
<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, sendEmailVerification, sendPasswordResetEmail, updatePassword, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { doc, collection, query, where, onSnapshot, getDocs, setDoc, addDoc, updateDoc, deleteDoc, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { INSTRUMENTS, BY_SYMBOL, priceAt, prevClose, series } from "./market.js";

const FEE_BPS = 10, $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = m => (m < 0 ? '-' : '') + '$' + (Math.abs(m) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const ms = t => t?.toMillis ? t.toMillis() : (t || 0), dt = t => t ? new Date(ms(t)).toLocaleString() : '—';
const cls = n => n > 0 ? 'up' : n < 0 ? 'dn' : '', sgn = m => (m > 0 ? '+' : '') + fmt(m);
const fee = n => Math.max(n > 0 ? 1 : 0, Math.round(n * FEE_BPS / 10000));
const uid = () => crypto.randomUUID().replace(/-/g, '');
const S = window.S = { user: null, admin: false, view: 'dashboard', mode: 'login', acct: null, pos: [], orders: [], jr: [], dep: [], wd: [], notes: [], wl: [], alerts: [], tix: [],
  sym: 'AAPL', side: 'buy', type: 'market', qty: '1', limit: '', q: '', tab: 'overview', A: {}, inspect: null, ij: [], from: '', month: '', health: null, name: '' };
let unsubs = [];
const sub = (q, fn) => unsubs.push(onSnapshot(q, fn, e => console.warn('listener', e.code)));
const toast = (m, bad) => { const d = document.createElement('div'); d.className = bad ? 'bad' : ''; d.textContent = m; $('#toast').append(d); setTimeout(() => d.remove(), 5000); };
const modal = h => { $('#modal').innerHTML = `<div class="card">${h}</div>`; $('#modal').classList.add('on'); };
const closeModal = () => $('#modal').classList.remove('on');
async function api(path, body) {
  const t = await auth.currentUser.getIdToken();
  let r, j; try { r = await fetch('/api/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t }, body: JSON.stringify(body) }); j = await r.json(); } catch { throw new Error('Server unreachable. Check your connection and try again.'); }
  if (!j.ok) { const e = new Error(j.error || 'Request failed'); e.code = j.code; throw e; } return j;
}
const AUTH_ERR = { 'auth/email-already-in-use': 'That email is already registered. Sign in instead.', 'auth/invalid-credential': 'Incorrect email or password.', 'auth/wrong-password': 'Incorrect email or password.', 'auth/user-not-found': 'Incorrect email or password.', 'auth/weak-password': 'Password must be at least 8 characters.', 'auth/invalid-email': 'Enter a valid email address.', 'auth/user-disabled': 'This account is disabled. Contact support.', 'auth/too-many-requests': 'Too many attempts. Wait a few minutes and try again.', 'auth/network-request-failed': 'Network error. Check your connection.', 'auth/requires-recent-login': 'Please sign in again to do this.' };
const aerr = e => AUTH_ERR[e.code] || e.message || 'Something went wrong.';

/* ---------- computed ---------- */
const px = s => priceAt(s);
function pf() {
  let mv = 0, cost = 0, daily = 0; const rows = [];
  for (const p of S.pos) if (p.qty > 0) { const x = px(p.symbol), v = p.qty * x; mv += v; cost += p.costBasisMinor; daily += p.qty * (x - prevClose(p.symbol)); rows.push({ ...p, x, v, u: v - p.costBasisMinor }); }
  const a = S.acct || { cash: 0, reserved: 0, hold: 0, realizedPnlMinor: 0 };
  return { mv, cost, un: mv - cost, daily, rows, total: a.cash + a.reserved + a.hold + mv };
}
const pxc = s => `<span class="n" data-px="${s}">${fmt(px(s))}</span>`;
const chg = s => { const d = px(s) - prevClose(s), p = d / prevClose(s) * 100; return `<span class="n ${cls(d)}" data-chg="${s}">${d >= 0 ? '+' : ''}${p.toFixed(2)}%</span>`; };
const kpi = (l, v, c = '') => `<div class="kpi"><div class="l">${l}</div><div class="v n ${c}">${v}</div></div>`;
const stat = s => `<span class="${s === 'approved' || s === 'completed' || s === 'filled' || s === 'posted' ? 'up' : s === 'suspended' || s === 'failed' || s === 'rejected' ? 'dn' : 'am'}">${esc(String(s).replace('_', ' '))}</span>`;
const cashDelta = (j, u) => j.lines.filter(l => l.acct === 'CASH:' + u).reduce((a, l) => a + l.cr - l.dr, 0);
const byTime = (a, b) => ms(b.createdAt || b.at) - ms(a.createdAt || a.at);

/* ---------- auth ---------- */
function authView() {
  const m = S.mode;
  $('#app').innerHTML = `<div class="auth"><div class="logo" style="margin-bottom:16px"><b>X</b> FUNDS</div><div class="card">
  <div class="tabs">${[['login', 'Sign in'], ['register', 'Register'], ['reset', 'Reset password']].map(([k, t]) => `<button class="${m === k ? 'on' : ''}" onclick="go.mode('${k}')">${t}</button>`).join('')}</div>
  ${m === 'register' ? `<label>Full name</label><input id="nm" autocomplete="name" maxlength="80">` : ''}
  <label>Email</label><input id="em" type="email" autocomplete="email">
  ${m !== 'reset' ? `<label>Password</label><input id="pw" type="password" autocomplete="${m === 'login' ? 'current-password' : 'new-password'}">` : ''}
  ${m === 'register' ? `<label>Confirm password</label><input id="pw2" type="password" autocomplete="new-password"><p class="sm mut">Minimum 8 characters. A verification email will be sent.</p>` : ''}
  <div id="aerr" class="dn sm" style="margin:10px 0;min-height:18px"></div>
  <button class="btn" style="width:100%" id="abtn" onclick="go.auth()">${m === 'login' ? 'Sign in' : m === 'register' ? 'Create account' : 'Send reset link'}</button></div>
  <p class="sm mut">Paper-trading platform. Real-money operations are disabled.</p></div>`;
  $('#app').onkeydown = e => { if (e.key === 'Enter') go.auth(); };
}

/* ---------- boot ---------- */
async function boot(user) {
  unsubs.forEach(u => u()); unsubs = [];
  try {
    const tr = await user.getIdTokenResult(true); S.admin = tr.claims.admin === true;
    await api('account', { displayName: S.name });
  } catch (e) { if (e.code === 'invalid_session' || e.code === 'unauthenticated') { await signOut(auth); toast(e.message, true); return; } if (e.code !== 'server_not_configured') console.warn(e); else toast('Server is not configured (FIREBASE_SERVICE_ACCOUNT missing).', true); }
  S.user = user; S.view = S.admin ? 'admin' : 'dashboard';
  if (S.admin) subscribeAdmin(); else subscribeCustomer(user.uid);
  render();
}
function subscribeCustomer(u) {
  const by = (c, k) => sub(query(collection(db, c), where('uid', '==', u)), s => { S[k] = s.docs.map(d => ({ id: d.id, ...d.data() })); draw(); });
  sub(doc(db, 'accounts', u), s => { S.acct = s.data() || null; draw(); });
  sub(doc(db, 'watchlists', u), s => { S.wl = s.data()?.symbols || []; draw(); });
  [['positions', 'pos'], ['orders', 'orders'], ['ledger_journal', 'jr'], ['deposits', 'dep'], ['withdrawals', 'wd'], ['notifications', 'notes'], ['price_alerts', 'alerts'], ['support_tickets', 'tix']].forEach(([c, k]) => by(c, k));
}
function subscribeAdmin() {
  const all = (c, k, ...q) => sub(query(collection(db, c), ...q), s => { S.A[k] = s.docs.map(d => ({ id: d.id, ...d.data() })); draw(); });
  all('users', 'users'); all('accounts', 'accounts'); all('positions', 'pos'); all('withdrawals', 'wd'); all('deposits', 'dep'); all('admin_adjustments', 'adj'); all('support_tickets', 'tix');
  all('orders', 'orders', orderBy('createdAt', 'desc'), limit(100)); all('ledger_journal', 'jr', orderBy('createdAt', 'desc'), limit(100));
  all('audit_logs', 'audit', orderBy('at', 'desc'), limit(100)); all('reconciliations', 'recon', orderBy('at', 'desc'), limit(5));
  const t0 = Date.now(); api('account', {}).then(() => S.health = { ok: true, ms: Date.now() - t0 }).catch(e => S.health = { ok: false, msg: e.message }).finally(draw);
}
let raf; function draw() { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }

/* ---------- shell ---------- */
const CUST = [['dashboard', 'Dashboard'], ['trade', 'Trade'], ['portfolio', 'Portfolio'], ['funding', 'Funding'], ['activity', 'Activity'], ['watch', 'Watchlist'], ['inbox', 'Inbox'], ['settings', 'Settings']];
function render() {
  if (!S.user) return authView();
  const f = document.activeElement, fid = f?.id, pos = f?.selectionStart;
  const unread = S.notes.filter(n => !n.read).length;
  const nav = S.admin ? [['admin', 'Admin console']] : CUST;
  $('#app').innerHTML = `<header><div class="logo"><b>X</b> FUNDS</div><nav>${nav.map(([k, t]) => `<button class="${S.view === k ? 'on' : ''}" onclick="go.view('${k}')">${t}${k === 'inbox' && unread ? ` (${unread})` : ''}</button>`).join('')}</nav>
  <span class="sm mut">${esc(S.user.email)}</span><button class="btn sec sm" onclick="go.out()">Sign out</button></header>
  <main>${S.user.emailVerified || S.admin ? '' : `<div class="banner">Verify your email to trade and move funds. Check your inbox. <button class="btn sec sm" onclick="go.resend()">Resend email</button> <button class="btn sec sm" onclick="go.recheck()">I've verified</button></div>`}
  ${S.acct?.status && S.acct.status !== 'approved' && !S.admin ? `<div class="banner">Account status: <b>${esc(S.acct.status)}</b>. ${S.acct.status === 'restricted' ? 'Buying and funding are disabled.' : 'All activity is disabled.'} Contact support from the Inbox.</div>` : ''}
  ${VIEWS[S.view]()}</main>`;
  if (fid) { const e = document.getElementById(fid); if (e) { e.focus(); try { e.setSelectionRange(pos, pos); } catch {} } }
}
setInterval(() => { // live price ticks without re-rendering forms
  document.querySelectorAll('[data-px]').forEach(e => e.textContent = fmt(px(e.dataset.px)));
  document.querySelectorAll('[data-chg]').forEach(e => { const s = e.dataset.chg, d = px(s) - prevClose(s); e.textContent = (d >= 0 ? '+' : '') + (d / prevClose(s) * 100).toFixed(2) + '%'; e.className = 'n ' + cls(d); });
}, 5000);
setInterval(() => { if (S.user && !S.admin && auth.currentUser && (S.user.emailVerified)) api('order', { action: 'sweep' }).catch(() => {}); }, 30000);

/* ---------- customer views ---------- */
const alloc = P => { const a = S.acct || { cash: 0 }; const items = [['Cash', a.cash + (a.reserved || 0) + (a.hold || 0), '#6366f1'], ...P.rows.map((r, i) => [r.symbol, r.v, ['#10b981', '#f59e0b', '#06b6d4', '#ec4899', '#84cc16', '#a78bfa'][i % 6]])].filter(i => i[1] > 0), t = items.reduce((s, i) => s + i[1], 0) || 1;
  return `<div class="bar">${items.map(i => `<div style="width:${i[1] / t * 100}%;background:${i[2]}" title="${i[0]}"></div>`).join('')}</div><div class="leg">${items.map(i => `<span><i style="background:${i[2]}"></i>${i[0]} ${(i[1] / t * 100).toFixed(1)}%</span>`).join('')}</div>`; };
const VIEWS = {
  dashboard() {
    const a = S.acct; if (!a) return '<p class="mut">Loading your account…</p>'; const P = pf();
    const movers = INSTRUMENTS.map(i => [i.symbol, (px(i.symbol) - prevClose(i.symbol)) / prevClose(i.symbol)]).sort((x, y) => Math.abs(y[1]) - Math.abs(x[1])).slice(0, 5);
    return `<h1>${esc(S.name || S.user.displayName || S.user.email.split('@')[0])} <span class="sm mut">· Account ${esc(a.accountId)} · ${stat(a.status)} · USD · paper</span></h1>
    <div class="grid">${kpi('Total portfolio value', fmt(P.total))}${kpi('Available cash / buying power', fmt(a.cash))}${kpi('Reserved buying power', fmt(a.reserved))}${kpi('Unsettled cash', fmt(0))}${kpi('Withdrawable', fmt(a.cash))}${kpi('Invested market value', fmt(P.mv))}${kpi('Unrealized P/L', sgn(P.un), cls(P.un))}${kpi('Realized P/L', sgn(a.realizedPnlMinor || 0), cls(a.realizedPnlMinor))}${kpi('Daily change', sgn(P.daily), cls(P.daily))}</div>
    <div class="g2"><div class="card"><h2>Allocation</h2>${alloc(P)}</div>
    <div class="card"><h2>Market overview <span class="sm mut">(simulated)</span></h2><table>${movers.map(m => `<tr class="sel" onclick="go.open('${m[0]}')"><td><b>${m[0]}</b></td><td class="n">${pxc(m[0])}</td><td class="n">${chg(m[0])}</td></tr>`).join('')}</table></div></div>
    <div class="g2"><div class="card"><h2>Open orders</h2>${ordersTable(S.orders.filter(o => ['open', 'partially_filled'].includes(o.status)), true)}</div>
    <div class="card"><h2>Recent transactions</h2>${jrTable([...S.jr].sort(byTime).slice(0, 6))}</div></div>
    <div class="g2"><div class="card"><h2>Completed trades</h2>${ordersTable([...S.orders].filter(o => o.filledQty > 0).sort(byTime).slice(0, 5))}</div>
    <div class="card"><h2>Notifications</h2>${[...S.notes].sort(byTime).slice(0, 4).map(n => `<p style="margin:6px 0"><b>${esc(n.title)}</b><br><span class="sm mut">${esc(n.body)} · ${dt(n.createdAt)}</span></p>`).join('') || '<p class="mut">Nothing yet.</p>'}</div></div>`;
  },
  trade() {
    const i = BY_SYMBOL[S.sym], p = px(S.sym), s = series(S.sym), lo = Math.min(...s), hi = Math.max(...s), W = 600, H = 150;
    const pts = s.map((v, k) => `${(k / (s.length - 1) * W).toFixed(1)},${(H - 8 - (v - lo) / ((hi - lo) || 1) * (H - 16)).toFixed(1)}`).join(' ');
    const held = S.pos.find(x => x.symbol === S.sym), avail = held ? held.qty - (held.held || 0) : 0;
    return `<h1>Trade <span class="sm mut">· SIMULATED quotes and executions</span></h1><div class="g2" style="grid-template-columns:minmax(260px,1fr) 2fr">
    <div class="card"><input id="srch" placeholder="Search symbol or name" value="${esc(S.q)}" oninput="S.q=this.value;go.list()"><div id="ilist" class="tw" style="margin-top:8px;max-height:460px;overflow:auto">${instList()}</div></div>
    <div><div class="card"><div class="row"><div><h2 style="margin:0">${i.symbol} <span class="sm mut">${esc(i.name)}</span></h2><span class="sm mut">${i.type} · ${i.exchange} · simulated data</span></div><div style="text-align:right"><div style="font-size:24px;font-weight:800">${pxc(S.sym)}</div>${chg(S.sym)}</div></div>
    <svg class="ch" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="var(--em)" stroke-width="2" points="${pts}"/></svg>
    <div class="sm mut">3-hour simulated history · Prev close ${fmt(prevClose(S.sym))} · Range ${fmt(lo)} – ${fmt(hi)}</div></div>
    <div class="card"><h2>Order ticket</h2><div class="seg"><button class="${S.side === 'buy' ? 'on b' : ''}" onclick="S.side='buy';draw()">BUY</button><button class="${S.side === 'sell' ? 'on s' : ''}" onclick="S.side='sell';draw()">SELL</button></div>
    <div class="row"><div><label>Type</label><select id="ty" onchange="S.type=this.value;draw()"><option value="market" ${S.type === 'market' ? 'selected' : ''}>Market</option><option value="limit" ${S.type === 'limit' ? 'selected' : ''}>Limit</option></select></div>
    <div><label>Quantity (whole shares)</label><input id="qty" inputmode="numeric" value="${esc(S.qty)}" oninput="S.qty=this.value;go.est()"></div>
    ${S.type === 'limit' ? `<div><label>Limit price (USD)</label><input id="lim" inputmode="decimal" value="${esc(S.limit)}" oninput="S.limit=this.value;go.est()"></div>` : ''}</div>
    <p class="sm mut">Buying power ${fmt(S.acct?.cash || 0)} · Sellable ${avail} sh · Commission ${FEE_BPS / 100}% (simulated)</p><div id="est" class="n" style="margin:8px 0"></div>
    <button class="btn" onclick="go.review()">Review order</button></div></div></div>
    <div class="card"><h2>Orders</h2>${ordersTable([...S.orders].sort(byTime).slice(0, 25), true)}</div>`;
  },
  portfolio() {
    const P = pf(); return `<h1>Portfolio</h1><div class="grid">${kpi('Market value', fmt(P.mv))}${kpi('Cost basis', fmt(P.cost))}${kpi('Unrealized P/L', sgn(P.un), cls(P.un))}${kpi('Day change', sgn(P.daily), cls(P.daily))}</div>
    <div class="card"><h2>Allocation</h2>${alloc(P)}</div><div class="card tw"><h2>Holdings</h2><table><tr><th>Symbol<th class="r">Qty<th class="r">Avg cost<th class="r">Price<th class="r">Value<th class="r">Unrealized<th>

      if (m === 'register') { if (pw.length < 8) throw { code: 'auth/weak-password' }; if (pw !== val('pw2')) throw new Error('Passwords do not match.'); S.name = val('nm').trim(); const c = await createUserWithEmailAndPassword(auth, em, pw); sendEmailVerification(c.user).catch(() => {}); toast('Account created. Verification email sent.'); }
      else await signInWithEmailAndPassword(auth, em, pw);
    } catch (x) { e.textContent = aerr(x); } finally { busy(b, false); }
  },
  async out() { unsubs.forEach(u => u()); unsubs = []; await signOut(auth); },
  async resend() { try { await sendEmailVerification(auth.currentUser); toast('Verification email sent.'); } catch (e) { toast(aerr(e), true); } },
  async recheck() { await auth.currentUser.reload(); await boot(auth.currentUser); if (!auth.currentUser.emailVerified) toast('Still not verified.', true); },
  review() {
    const q = parseInt(S.qty, 10), p = S.type === 'limit' ? Math.round(parseFloat(S.limit || 0) * 100) : px(S.sym);
    if (!(q >= 1) || String(q) !== String(S.qty).trim()) return toast('Quantity must be a whole number.', true);
    if (S.type === 'limit' && !(p > 0)) return toast('Enter a valid limit price.', true);
    S.idem = uid(); const g = q * p;
    modal(`<h2>Confirm simulated order</h2><p><b>${S.side.toUpperCase()} ${q} ${S.sym}</b> · ${S.type}${S.type === 'limit' ? ' @ ' + fmt(p) : ' at the server simulated price (now ≈ ' + fmt(p) + ')'}</p><p class="n">Estimated ${S.side === 'buy' ? 'cost' : 'proceeds'}: ${fmt(S.side === 'buy' ? g + fee(g) : g - fee(g))}</p><p class="sm mut">Simulated execution. Not placed on a real exchange. Final fill price is set by the server.</p><div class="row"><button class="btn sec" onclick="closeModal()">Back</button><button class="btn" id="cf" onclick="go.place()">Place order</button></div>`);
  },
  async place() { const b = $('#cf'); busy(b, true); try { const r = await api('order', { action: 'place', symbol: S.sym, side: S.side, type: S.type, qty: parseInt(S.qty, 10), limitPrice: S.limit, idempotencyKey: S.idem }); closeModal(); toast(`Order ${r.status.replace('_', ' ')} (simulated)`); } catch (e) { busy(b, false); closeModal(); toast(e.message, true); } },
  async cancel(id) { try { await api('order', { action: 'cancel', orderId: id }); toast('Order canceled; reserved funds released.'); } catch (e) { toast(e.message, true); } },
  async fund() { const a = val('wamt'); try { const r = await api('funding', { kind: 'withdraw', amount: a, idempotencyKey: uid() }); toast(`Withdrawal ${r.status.replace('_', ' ')} · ${r.reference} (simulated)`); } catch (e) { toast(e.message, true); } },
  async deposit() { try { const r = await api('deposits', { action: 'submit', amount: val('damt'), paymentMethod: val('dpm'), paymentReference: val('dref'), paymentDate: val('ddate'), notes: val('dnote'), idempotencyKey: uid() }); toast(`Request submitted · status: ${r.status.replace('_', ' ')}. Your balance is unchanged until approved.`); } catch (e) { toast(e.message, true); } },
  async depReview(id, action) { let reason = ''; if (action === 'reject') { reason = (prompt('Rejection explanation shown to the customer (required):') || '').trim(); if (!reason) return; } try { const r = await api('deposits', { action, id, reason, idempotencyKey: uid() }); toast(`Deposit ${r.status.replace('_', ' ')}.`); } catch (e) { toast(e.message, true); } },
  csv() { const rows = [['Date', 'Type', 'Description', 'Reference', 'Cash change (USD)'], ...stmt().map(j => [new Date(ms(j.createdAt)).toISOString(), j.type, j.memo, j.ref || '', (cashDelta(j, S.user.uid) / 100).toFixed(2)])];
    const t = '"SIMULATED paper-trading statement. Not a regulated account statement."\n' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv' })); a.download = `xfunds-statement-${S.month || 'all'}.csv`; a.click(); },
  async wadd() { const s = val('wsym'); if (S.wl.includes(s)) return; await setDoc(doc(db, 'watchlists', S.user.uid), { symbols: [...S.wl, s], updatedAt: serverTimestamp() }).catch(e => toast(e.message, true)); },
  async wrm(s) { await setDoc(doc(db, 'watchlists', S.user.uid), { symbols: S.wl.filter(x => x !== s), updatedAt: serverTimestamp() }).catch(e => toast(e.message, true)); },
  async aadd() { const p = Math.round(parseFloat(val('apx')) * 100); if (!(p > 0)) return toast('Enter a valid price.', true); await addDoc(collection(db, 'price_alerts'), { uid: S.user.uid, symbol: val('asym'), direction: val('adir'), priceMinor: p, active: true, createdAt: serverTimestamp() }).catch(e => toast(e.message, true)); },
  async arm(id) { await deleteDoc(doc(db, 'price_alerts', id)).catch(e => toast(e.message, true)); },
  async read(id) { await updateDoc(doc(db, 'notifications', id), { read: true }).catch(() => {}); },
  async ticket() { const s = val('ts').trim(), m = val('tm').trim(); if (!s || !m) return toast('Add a subject and message.', true); try { await addDoc(collection(db, 'support_tickets'), { uid: S.user.uid, subject: s, message: m, status: 'open', createdAt: serverTimestamp() }); toast('Ticket sent.'); } catch (e) { toast(e.message, true); } },
  async profile() { try { await updateDoc(doc(db, 'users', S.user.uid), { displayName: val('pn').trim().slice(0, 80), phone: val('pp').trim().slice(0, 30) }); S.name = val('pn').trim(); toast('Profile saved.'); } catch (e) { toast(e.message, true); } },
  async pw() { try { if (val('np').length < 8) throw { code: 'auth/weak-password' }; await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(S.user.email, val('cp'))); await updatePassword(auth.currentUser, val('np')); toast('Password updated.'); } catch (e) { toast(aerr(e), true); } },
  // admin
  async inspect(u) { S.inspect = u; const s = await getDocs(query(collection(db, 'ledger_journal'), where('uid', '==', u))); S.ij = s.docs.map(d => ({ id: d.id, ...d.data() })); draw(); },
  status(u) { const x = S.A.users.find(a => a.uid === u); modal(`<h2>Set account status</h2><p>${esc(x.email)}</p><select id="ns"><option>approved</option><option>restricted</option><option>suspended</option></select><label>Reason (required)</label><input id="nr" maxlength="300"><p class="sm mut">Suspending disables sign-in and revokes sessions.</p><div class="row"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="go.doStatus('${u}')">Apply</button></div>`); },
  async doStatus(u) { await go.adm({ action: 'setStatus', target: u, status: val('ns'), reason: val('nr') }, 'Status updated.'); },
  adjReview() {
    const t = val('at').trim(), amt = val('am').trim(); if (!t || !amt) return toast('Customer and amount are required.', true);
    const u = S.A.users.find(x => x.uid === t || x.email.toLowerCase() === t.toLowerCase()); if (!u) return toast('Customer not found in the loaded list.', true);
    const a = acctOf(u.uid), n = Math.round(parseFloat(amt) * 100), d = val('ad'); if (!(n > 0)) return toast('Enter a valid amount.', true);
    const after = a.cash + (d === 'credit' ? n : -n); if (after < 0) return toast(`Insufficient eligible funds: available ${fmt(a.cash)}.`, true);
    S.adj = { action: 'adjust', target: u.uid, accountId: val('aa').trim(), direction: d, amount: amt, currency: 'USD', reason: val('ar'), reference: val('af').trim(), note: val('an').trim(), idempotencyKey: uid() };
    modal(`<h2>Confirm ${d}</h2><table><tr><td>Customer<td>${esc(u.email)}<tr><td>Account<td class="mono">${esc(a.accountId)}<tr><td>Current eligible balance<td class="n">${fmt(a.cash)}<tr><td>${d === 'credit' ? 'Credit' : 'Debit'}<td class="n ${d === 'credit' ? 'up' : 'dn'}">${fmt(n)} USD<tr><td>Resulting balance<td class="n">${fmt(after)}<tr><td>Reason<td>${esc(S.adj.reason)}</table><p class="sm mut">Simulated cash only. Large amounts require a second administrator.</p><div class="row"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" id="cf" onclick="go.adjPost()">Post adjustment</button></div>`);
  },
  async adjPost() { const b = $('#cf'); busy(b, true); try { const r = await api('admin', S.adj); closeModal(); toast(r.status === 'posted' ? `Posted. New balance ${fmt(r.newCashMinor)}` : r.message); } catch (e) { busy(b, false); closeModal(); toast(e.message, true); } },
  async adm(body, ok) { try { const r = await api('admin', body); closeModal(); toast(ok || 'Done.'); return r; } catch (e) { toast(e.message, true); } },
  wd(id, d) { go.adm({ action: 'reviewWithdrawal', id, decision: d }, `Withdrawal ${d}d.`); }, pend(id, d) { go.adm({ action: 'approvePending', id, decision: d }, `Adjustment ${d}d.`); },
  reverse(id) { modal(`<h2>Reverse journal entry</h2><p class="sm mut">Posts a new offsetting entry referencing the original. The original is never edited.</p><label>Reason (required)</label><input id="rr" maxlength="300"><div class="row"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn dng" onclick="go.doRev('${id}')">Reverse</button></div>`); },
  async doRev(id) { await go.adm({ action: 'reverse', journalId: id, reason: val('rr') }, 'Reversal posted.'); if (S.inspect) go.inspect(S.inspect); },
  async recon() { const r = await go.adm({ action: 'reconcile' }); if (r) toast(r.ok ? 'Ledger reconciles.' : `${r.exceptions.length} exception(s) found.`, !r.ok); },
  async tclose(id) { await updateDoc(doc(db, 'support_tickets', id), { status: 'closed' }).catch(e => toast(e.message, true)); },
};
window.closeModal = closeModal; window.draw = draw;
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
onAuthStateChanged(auth, u => { if (u) boot(u); else { S.user = null; S.admin = false; S.acct = null; S.A = {}; unsubs.forEach(x => x()); unsubs = []; authView(); } });
authView();
</script>
</body></html>
